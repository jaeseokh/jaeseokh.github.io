project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - research/*.qmd

website:
  title: "Jaeseok Hwang"
  search: true
  repo-url: https://github.com/jaeseokh/jaeseokh.github.io
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research/index.qmd
        text: Research Dashboard
  page-footer:
    center: "Built with Quarto for macro research, daily review, and recruiter-facing documentation"

format:
  html:
    theme: cosmo
    toc: false
    css: assets/styles.css
    code-link: true
    smooth-scroll: true

# freeze HTML so unchanged pages don’t rebuild every time
freeze: auto

# make /assets available to subprojects during render
resources:
  - assets
